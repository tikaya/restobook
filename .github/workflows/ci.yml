name: CI RestoBook

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

# Variable globale pour skipper Electron partout
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1

jobs:

  # ═══════════════════════════════
  # JOB 1 : Tests unitaires
  # ═══════════════════════════════
  tests-unitaires:
    name: Tests unitaires
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node.js 24.15.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'npm'

      - name: Installer les dépendances (sans Electron)
        run: npm ci --ignore-scripts

      - name: Lancer les tests unitaires
        run: npx jest tests/unit --verbose --forceExit

  # ═══════════════════════════════
  # JOB 2 : Tests d'intégration
  # ═══════════════════════════════
  tests-integration:
    name: Tests d'intégration
    runs-on: ubuntu-latest
    needs: tests-unitaires

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node.js 24.15.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'npm'

      - name: Installer les dépendances (sans Electron)
        run: npm ci --ignore-scripts

      - name: Lancer les tests d'intégration
        run: npx jest tests/integration --verbose --forceExit

  # ═══════════════════════════════
  # JOB 3 : Tests CRITIQUES avec BDD
  # ═══════════════════════════════
  tests-critiques:
    name: Tests critiques (BDD réelle)
    runs-on: ubuntu-latest
    needs: tests-integration

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER:     restobook
          POSTGRES_PASSWORD: restobook123
          POSTGRES_DB:       restobook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node.js 24.15.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'npm'

      - name: Installer les dépendances (sans Electron)
        run: npm ci --ignore-scripts

      - name: Installer client PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Initialiser le schéma PostgreSQL
        env:
          PGPASSWORD: restobook123
        run: psql -h localhost -U restobook -d restobook_test -f database/init.sql

      - name: Créer le fichier .env.test
        run: |
          cat > .env.test << 'EOF'
          NODE_ENV=test
          PORT=3001
          DATABASE_URL=postgresql://restobook:restobook123@localhost:5432/restobook_test
          MONGO_URL=mongodb://localhost:27017/restobook_test
          JWT_SECRET=test_secret_pour_les_tests_uniquement
          JWT_EXPIRES_IN=1h
          EOF

      - name: Lancer les tests critiques
        run: npx jest tests/critical --verbose --forceExit