name: CI RestoBook

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:

  # ═══════════════════════════════
  # JOB 1 : Tests unitaires
  # (pas besoin de BDD — logique pure)
  # ═══════════════════════════════
  tests-unitaires:
    name: Tests unitaires
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node.js 24.15.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer les tests unitaires
        run: npx jest tests/unit --verbose --forceExit

  # ═══════════════════════════════
  # JOB 2 : Tests d'intégration
  # (pas besoin de BDD — juste HTTP)
  # ═══════════════════════════════
  tests-integration:
    name: Tests d'intégration
    runs-on: ubuntu-latest
    needs: tests-unitaires

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node.js 24.15.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer les tests d'intégration
        run: npx jest tests/integration --verbose --forceExit

  # ═══════════════════════════════
  # JOB 3 : Tests CRITIQUES
  # (BDD éphémère PostgreSQL + MongoDB)
  # ═══════════════════════════════
  tests-critiques:
    name: Tests critiques (BDD réelle)
    runs-on: ubuntu-latest
    needs: tests-integration

    # ── Services éphémères ──
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER:     restobook
          POSTGRES_PASSWORD: restobook123
          POSTGRES_DB:       restobook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node.js 24.15.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Initialiser le schéma PostgreSQL
        run: psql postgresql://restobook:restobook123@localhost:5432/restobook_test -f database/init.sql

      - name: Créer le fichier .env.test
        run: |
          echo "NODE_ENV=test"                                                              >> .env.test
          echo "PORT=3001"                                                                  >> .env.test
          echo "DATABASE_URL=postgresql://restobook:restobook123@localhost:5432/restobook_test" >> .env.test
          echo "MONGO_URL=mongodb://localhost:27017/restobook_test"                         >> .env.test
          echo "JWT_SECRET=test_secret_pour_les_tests_uniquement"                           >> .env.test
          echo "JWT_EXPIRES_IN=1h"                                                          >> .env.test

      - name: Lancer les tests critiques
        run: npx jest tests/critical --verbose --forceExit